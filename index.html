<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=10, user-scalable=yes, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>Webtoon Reader</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    /* Full-bleed strip: true viewport width, no side gutters */
    #strip {
      margin: 0;
      padding: 0;
      width: 100vw;
      max-width: 100vw;
      font-size: 0;
      line-height: 0;
      background: #000;
    }
    #strip img {
      display: block !important;
      width: 100vw !important;
      max-width: 100vw !important;
      min-width: 100vw !important;
      height: auto !important;
      margin: 0 !important;
      padding: 0 !important;
      border: 0 !important;
      outline: 0 !important;
      vertical-align: top;
      background: #000;
      /* avoid sub-pixel seams */
      transform: translateZ(0);
    }
    /* floating HUD — does not create side margins on the strip */
    #hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      padding: calc(8px + env(safe-area-inset-top)) 10px 10px;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), rgba(0,0,0,0));
      pointer-events: none;
      font-size: 12px;
      text-shadow: 0 1px 2px #000;
    }
    #hud .btns { pointer-events: auto; display: flex; gap: 6px; }
    #hud button {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,.14);
      color: #fff;
      font-size: 12px;
      backdrop-filter: blur(6px);
    }
    #status {
      min-height: 40vh;
      display: grid;
      place-items: center;
      padding: 24px;
      text-align: center;
      opacity: .85;
      font-size: 14px;
      line-height: 1.5;
    }
    #status.hidden { display: none; }
    .end {
      padding: 24px 12px calc(32px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 12px;
      opacity: .45;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="title">Loading…</div>
    <div class="btns">
      <button type="button" id="btnTop" title="Back to top">↑</button>
      <button type="button" id="btnReload" title="Reload">↻</button>
    </div>
  </div>
  <div id="status">Loading chapter…</div>
  <div id="strip" hidden></div>
  <div class="end" id="end" hidden></div>

  <script>
  (function () {
    const statusEl = document.getElementById('status');
    const stripEl = document.getElementById('strip');
    const titleEl = document.getElementById('title');
    const endEl = document.getElementById('end');

    function showError(msg) {
      statusEl.classList.remove('hidden');
      statusEl.textContent = msg;
      stripEl.hidden = true;
    }

    function parseConfig() {
      // Prefer hash payload: #c=<base64url(json)>  or #e=<uri-encoded json>
      // Also support ?src=<json-url>
      const params = new URLSearchParams(location.search);
      const src = params.get('src');
      if (src) return fetch(src, { cache: 'no-store' }).then(r => {
        if (!r.ok) throw new Error('config fetch failed: ' + r.status);
        return r.json();
      });

      const hash = location.hash.replace(/^#/, '');
      if (!hash) return Promise.reject(new Error('missing chapter data'));

      const q = new URLSearchParams(hash.includes('=') ? hash : ('c=' + hash));
      if (q.get('c')) {
        // base64url json
        let b64 = q.get('c').replace(/-/g, '+').replace(/_/g, '/');
        while (b64.length % 4) b64 += '=';
        const json = decodeURIComponent(escape(atob(b64)));
        return Promise.resolve(JSON.parse(json));
      }
      if (q.get('e')) {
        return Promise.resolve(JSON.parse(decodeURIComponent(q.get('e'))));
      }
      // raw json in hash
      try {
        return Promise.resolve(JSON.parse(decodeURIComponent(hash)));
      } catch (e) {
        return Promise.reject(new Error('invalid hash config'));
      }
    }

    function render(cfg) {
      const title = cfg.title || 'Webtoon';
      const images = cfg.images || cfg.pages || [];
      if (!images.length) throw new Error('no images in config');
      document.title = title;
      titleEl.textContent = title + ' · ' + images.length + 'p';

      stripEl.innerHTML = '';
      images.forEach((url, i) => {
        const img = document.createElement('img');
        img.src = url;
        img.alt = '';
        img.draggable = false;
        img.decoding = 'async';
        img.loading = i < 2 ? 'eager' : 'lazy';
        // Preload first few
        if (i < 2) {
          const l = document.createElement('link');
          l.rel = 'preload'; l.as = 'image'; l.href = url;
          document.head.appendChild(l);
        }
        stripEl.appendChild(img);
      });

      statusEl.classList.add('hidden');
      stripEl.hidden = false;
      endEl.hidden = false;
      endEl.textContent = '— end · ' + title + ' —';
    }

    document.getElementById('btnTop').onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    document.getElementById('btnReload').onclick = () => location.reload();

    parseConfig()
      .then(render)
      .catch(err => showError('无法加载章节：' + (err && err.message ? err.message : err) + '\n\n请检查链接是否完整。'));
  })();
  </script>
</body>
</html>
